<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storecops Admin</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/app.css">
  <script src="/vendor/chart.umd.min.js"></script>
  <style>
    body { font-family: var(--font-body); }
    .admin-login { max-width: 440px; margin: 80px auto; padding: 0 20px; }
    .admin-login-card {
      background: var(--surface); border: 1px solid var(--card-border);
      border-radius: var(--radius-lg); padding: 40px; text-align: center;
      box-shadow: var(--shadow-lg);
    }
    .admin-login-card .login-icon {
      width: 64px; height: 64px; border-radius: var(--radius);
      background: var(--primary-light); color: var(--primary);
      display: inline-flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .admin-login-card .login-icon svg { width: 32px; height: 32px; }
    .admin-login-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
    .admin-login-card p { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; font-weight: 450; }
    .admin-login input {
      width: 100%; padding: 12px 16px; border-radius: var(--radius-sm);
      border: 1px solid var(--card-border); background: var(--input-bg);
      color: var(--text); font-size: 14px; margin-bottom: 12px;
      font-family: var(--font-body); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .admin-login input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(8,144,108,0.1); }
    .admin-login .btn-enter {
      width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm);
      background: var(--primary); color: #fff; font-size: 14px; font-weight: 600;
      font-family: var(--font-body); cursor: pointer;
      transition: all 0.2s;
    }
    .admin-login .btn-enter:hover { background: var(--primary-deep); transform: translateY(-1px); }
    .admin-login .btn-enter:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    
    .admin-grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .admin-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .admin-grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
    @media (max-width: 1100px) { .admin-grid4 { grid-template-columns: repeat(2, 1fr); } .admin-grid3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { 
      .admin-grid2 { grid-template-columns: 1fr; } 
      .admin-grid4 { grid-template-columns: 1fr; }
      .admin-grid3 { grid-template-columns: 1fr; }
      .a-card { padding: 14px; }
      .a-kpi { font-size: 22px; }
      .side-nav { flex-direction: row; flex-wrap: wrap; gap: 4px; }
      .side-nav a { padding: 6px 10px; font-size: 11px; }
    }
    
    .a-card {
      background: var(--surface); border: 1px solid var(--card-border);
      border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow-sm); margin-bottom: 14px;
      transition: box-shadow 0.2s, transform 0.2s;
    }
    .a-card:hover { box-shadow: var(--shadow-md); }
    .a-card h3 {
      font-family: var(--font-head); font-size: 13px; color: var(--text-dim);
      margin-bottom: 8px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.04em; display: flex; align-items: center; gap: 6px;
    }
    .a-kpi { font-size: 28px; font-weight: 800; color: var(--text); letter-spacing: -0.03em; }
    .a-sub { font-size: 12px; color: var(--muted); margin-top: 4px; font-weight: 500; }
    .a-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .a-table th {
      text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--muted); border-bottom: 1px solid var(--card-border);
      font-weight: 600;
    }
    .a-table td { padding: 10px 14px; border-bottom: 1px solid var(--card-border); }
    .a-table tr:hover td { background: var(--primary-light); }
    .a-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .a-pill-red { background: rgba(239,68,68,0.1); color: var(--red); }
    .a-pill-amber { background: rgba(245,158,11,0.1); color: var(--amber); }
    .a-pill-green { background: rgba(8,144,108,0.1); color: var(--green); }
    .a-pill-violet { background: rgba(8,144,108,0.1); color: var(--primary); }
    .a-pill-blue { background: rgba(6,182,212,0.1); color: var(--cyan); }
    .a-pill-gray { background: rgba(138,144,173,0.1); color: var(--muted); }
    .a-alert { display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: var(--radius-sm); margin-bottom: 10px; }
    .a-alert-red { background: rgba(239,68,68,0.05); border-left: 3px solid var(--red); }
    .a-alert-amber { background: rgba(245,158,11,0.05); border-left: 3px solid var(--amber); }
    .a-alert-green { background: rgba(8,144,108,0.05); border-left: 3px solid var(--green); }
    .chart-wrap { position: relative; height: 220px; }
    .chart-wrap canvas { max-height: 100%; }
    .a-section { margin-bottom: 20px; }
    .a-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .a-btn {
      padding: 8px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
      cursor: pointer; border: none; background: var(--primary); color: #fff;
      font-family: var(--font-body); transition: all 0.2s;
    }
    .a-btn:hover { background: var(--primary-deep); transform: translateY(-1px); }
    .a-btn-sm {
      padding: 6px 14px; font-size: 12px; border-radius: var(--radius-sm); cursor: pointer;
      border: 1px solid var(--card-border); background: var(--surface); color: var(--text);
      font-family: var(--font-body); font-weight: 500; transition: all 0.15s;
    }
    .a-btn-sm:hover { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }
    .a-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13px; }
    .a-scroll { max-height: 360px; overflow-y: auto; }
    .a-tag { font-size: 11px; padding: 2px 8px; border-radius: 6px; background: var(--code-bg); color: var(--text-dim); font-weight: 500; }
    
    .section-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--primary-light); color: var(--primary);
      padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600;
      margin-bottom: 8px;
    }
    .section-chip svg { width: 12px; height: 12px; }
    
    .brief-banner {
      background: var(--grad); border-radius: var(--radius-lg); padding: 28px;
      color: #fff; margin-bottom: 20px; box-shadow: var(--shadow-lg);
    }
    .brief-banner h2 { font-size: 20px; font-weight: 700; margin: 0; color: #fff; }
    .brief-banner p { opacity: 0.9; margin: 6px 0 0; font-size: 13px; }
    .brief-banner .brief-kpi { font-size: 32px; font-weight: 800; color: #fff; }
    .brief-banner .brief-sub { opacity: 0.85; font-size: 12px; }
    @media (max-width: 1100px) { .admin-grid4 { grid-template-columns: repeat(2, 1fr); } .admin-grid3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 768px) { .admin-grid2 { grid-template-columns: 1fr; } .admin-grid4 { grid-template-columns: 1fr; } .admin-grid3 { grid-template-columns: 1fr; } }

    .a-tabs { display: flex; gap: 0; padding: 16px 20px 0; border-bottom: 1px solid var(--card-border); }
    .a-tab {
      padding: 8px 16px; font-size: 13px; font-weight: 500; color: var(--text-dim);
      text-decoration: none; border-bottom: 2px solid transparent; transition: all 0.15s;
    }
    .a-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
    .a-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  </style>
</head>
<body class="dark">

  <!-- ── LOGIN GATE ──────────────────────────────────────────────── -->
  <div id="admin-login" class="admin-login">
    <div class="admin-login-card">
      <div class="login-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.6 8-10V5.5L12 2 4 5.5V12c0 6.4 8 10 8 10z"/><path d="m9 11.5 2 2 4-4.5"/></svg>
      </div>
      <h2>Storecops Admin</h2>
      <p>Platform operator console — enter your master API key.</p>
      <input id="admin-key" type="password" placeholder="Master API key" autocomplete="current-password">
      <button class="btn-enter" onclick="adminLogin()">Enter Admin Console →</button>
      <p id="admin-error" style="color:var(--red);font-size:13px;margin-top:12px;min-height:16px"></p>
    </div>
  </div>

  <!-- ── APP SHELL ───────────────────────────────────────────────── -->
  <div id="admin-app" class="app hidden">
    <aside class="sidebar">
      <div class="side-logo">
        <span class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-3.6 8-10V5.5L12 2 4 5.5V12c0 6.4 8 10 8 10z"/><path d="m9 11.5 2 2 4-4.5"/></svg>
        </span>
        storecops <span class="a-tag" style="vertical-align:middle;background:var(--primary-light);color:var(--primary)">admin</span>
      </div>
      <nav class="side-nav">
        <a href="#/" data-route="overview"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span> Portfolio Dashboard</a>
        <a href="#/stores" data-route="stores"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></span> Client Management</a>
        <a href="#/billing" data-route="billing"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></span> Billing & Revenue</a>
        <a href="#/features" data-route="features"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></span> Client Success</a>
        <a href="#/settings" data-route="settings"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span> System Health</a>
        <a href="#/support" data-route="support"><span class="ico"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span> Support & Feedback</a>
      </nav>
      <div class="side-foot">
        <span style="font-size:12px;color:var(--muted)">Platform Operator</span>
        <button class="btn btn-ghost-sm" onclick="adminLogout()" style="width:auto">Log out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <h1 id="admin-title">Overview</h1>
        </div>
        <div class="topbar-right"></div>
      </header>
      <div id="admin-view" class="view"><!-- views render here --></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <script>
  /* ── Admin SPA ─────────────────────────────────────────────────── */
  (function () {
    const API = "/api/v1";
    const $ = (s) => document.querySelector(s);
    const view = $("#admin-view");
    let charts = [];
    let API_KEY = localStorage.getItem("storecops_admin_key") || "";

    function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" })[c]); }
    function money(n) { return n == null ? "—" : "$" + Number(n).toLocaleString(undefined, { maximumFractionDigits: 0 }); }
    function toast(msg) { const t = $("#toast"); t.innerHTML = msg; t.classList.add("show"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("show"), 4000); }
    function destroyCharts() { charts.forEach(c => c.destroy()); charts = []; }
    function makeChart(el, opts) { if (!el) return null; const c = new Chart(el, opts); charts.push(c); return c; }
    const GRAD = ["#08906c", "#34bf99", "#06b6d4", "#f59e0b", "#ef4444", "#f97316"];

    async function api(path) {
      const res = await fetch(API + path, { headers: { "X-API-Key": API_KEY } });
      if (res.status === 401) { adminLogout(); throw new Error("Session expired"); }
      return res.json();
    }

    /* ── Auth ─────────────────────────────────────────────────── */
    window.adminLogin = async function () {
      API_KEY = $("#admin-key").value.trim();
      if (!API_KEY) { $("#admin-error").textContent = "Enter your API key"; return; }
      try {
        const res = await fetch(API + "/admin/stores", { headers: { "X-API-Key": API_KEY } });
        if (!res.ok) throw new Error("Invalid key");
        localStorage.setItem("storecops_admin_key", API_KEY);
        showApp();
      } catch (e) { $("#admin-error").textContent = "Invalid API key. Use the master key from .env"; }
    };
    window.adminLogout = function () {
      localStorage.removeItem("storecops_admin_key");
      API_KEY = "";
      $("#admin-app").classList.add("hidden");
      $("#admin-login").classList.remove("hidden");
    };
    function showApp() {
      $("#admin-login").classList.add("hidden");
      $("#admin-app").classList.remove("hidden");
      route();
    }

    /* ── Router ───────────────────────────────────────────────── */
    // Consolidated admin modules — each group shares one page with a
    // tab strip on top. Every tab remains a full (hash) route that
    // re-renders the strip (highlighting the active tab) plus content.
    function tabStrip(tabs, active) {
      return tabs.map((t) =>
        `<a class="a-tab${t.key === active ? " active" : ""}" href="#/${t.route}">${t.label}</a>`
      ).join("");
    }
    function withTabs(tabs, activeKey, renderFn) {
      return async () => {
        view.innerHTML = `<div class="a-tabs">${tabStrip(tabs, activeKey)}</div><div id="a-tab-panel"></div>`;
        await renderFn(document.getElementById("a-tab-panel"));
      };
    }

    const ADMIN_TABS = {
      overview: [
        { key: "overview", route: "overview", label: "Portfolio" },
        { key: "brief", route: "brief", label: "CEO Brief" },
        { key: "forecast", route: "forecast", label: "Forecast" },
        { key: "conversion", route: "conversion", label: "Conversion" },
      ],
      stores: [
        { key: "stores", route: "stores", label: "Store Health" },
        { key: "return-fraud", route: "return-fraud", label: "Return Fraud" },
      ],
      billing: [
        { key: "billing", route: "billing", label: "Billing" },
        { key: "invoices", route: "invoices", label: "Invoices" },
        { key: "renewals", route: "renewals", label: "Renewals & ROI" },
      ],
      features: [
        { key: "features", route: "features", label: "Feature Adoption" },
        { key: "campaigns", route: "campaigns", label: "Campaigns" },
      ],
      settings: [
        { key: "settings", route: "settings", label: "System Settings" },
        { key: "ai-model", route: "ai-model", label: "AI Model" },
      ],
      support: [
        { key: "support", route: "support", label: "Support Desk" },
      ],
    };

    const ROUTES = {
      "": { title: "Portfolio Dashboard", render: withTabs(ADMIN_TABS.overview, "overview", renderOverview) },
      "overview": { title: "Portfolio Dashboard", render: withTabs(ADMIN_TABS.overview, "overview", renderOverview) },
      "brief": { title: "CEO Daily Brief", render: withTabs(ADMIN_TABS.overview, "brief", renderBrief) },
      "forecast": { title: "Revenue Forecast", render: withTabs(ADMIN_TABS.overview, "forecast", renderForecast) },
      "conversion": { title: "Conversion Intelligence", render: withTabs(ADMIN_TABS.overview, "conversion", renderConversion) },
      "stores": { title: "Client Management", render: withTabs(ADMIN_TABS.stores, "stores", renderStores) },
      "return-fraud": { title: "Return Fraud", render: withTabs(ADMIN_TABS.stores, "return-fraud", renderReturnFraud) },
      "billing": { title: "Billing & Revenue", render: withTabs(ADMIN_TABS.billing, "billing", renderBilling) },
      "invoices": { title: "Invoice Management", render: withTabs(ADMIN_TABS.billing, "invoices", renderInvoices) },
      "renewals": { title: "Renewals & ROI", render: withTabs(ADMIN_TABS.billing, "renewals", renderRenewals) },
      "features": { title: "Client Success", render: withTabs(ADMIN_TABS.features, "features", renderFeatures) },
      "campaigns": { title: "Campaigns", render: withTabs(ADMIN_TABS.features, "campaigns", renderCampaigns) },
      "settings": { title: "System Health", render: withTabs(ADMIN_TABS.settings, "settings", renderSettings) },
      "ai-model": { title: "AI Model", render: withTabs(ADMIN_TABS.settings, "ai-model", renderAiModel) },
      "support": { title: "Support & Feedback", render: withTabs(ADMIN_TABS.support, "support", renderSupport) },
    };
    const ADMIN_PARENT = {
      "": "overview", "overview": "overview", "brief": "overview", "forecast": "overview", "conversion": "overview",
      "stores": "stores", "return-fraud": "stores",
      "billing": "billing", "invoices": "billing", "renewals": "billing",
      "features": "features", "campaigns": "features",
      "settings": "settings", "ai-model": "settings",
      "support": "support",
    };
    function route() {
      const hash = (location.hash || "#/").replace("#/", "") || "";
      const target = ROUTES[hash] || ROUTES[""];
      $("#admin-title").textContent = target.title;
      const activeNav = ADMIN_PARENT[hash] ?? (hash || "overview");
      document.querySelectorAll(".side-nav a").forEach(a => a.classList.toggle("active", a.dataset.route === activeNav));
      destroyCharts();
      view.innerHTML = '<div class="a-empty"><span class="spinner"></span> Loading…</div>';
      target.render().catch(e => { view.innerHTML = `<div class="a-card"><h3>Error</h3><p class="a-sub">${esc(e.message)}</p></div>`; });
    }
    window.addEventListener("hashchange", route);

    /* ── Overview ─────────────────────────────────────────────── */
    async function renderOverview(container = view) {
      const [retention, pipeline, reminders] = await Promise.all([
        api("/admin/retention/dashboard"),
        api("/admin/leads/pipeline"),
        api("/admin/revenue/reminders"),
      ]);
      const m = retention.metrics || {};
      const risk = retention.risk_summary || {};
      const stores = retention.stores || [];
      const upgrades = retention.upgrade_candidates || [];
      const criticalStores = stores.filter(s => s.health?.risk?.band === "CRITICAL" || s.health?.risk?.band === "HIGH");
      const criticalReminders = (reminders.reminders || []).filter(r => r.urgency === "critical");

      container.innerHTML = `
        <div class="admin-grid4">
          <div class="a-card"><h3>Monthly Recurring Revenue</h3><div class="a-kpi">${money(m.mrr)}</div><div class="a-sub">ARR: ${money(m.arr)} · ARPA: ${money(m.arpa)}</div></div>
          <div class="a-card"><h3>Churn Rate</h3><div class="a-kpi" style="color:${(m.churn_rate||0)>10?'var(--red)':(m.churn_rate||0)>5?'var(--amber)':'var(--green)'}">${(m.churn_rate||0).toFixed(1)}%</div><div class="a-sub">NRR: ${(m.nrr||0).toFixed(1)}% · LTV: ${money(m.ltv)}</div></div>
          <div class="a-card"><h3>Active Stores</h3><div class="a-kpi">${m.active_subscriptions||0}</div><div class="a-sub">${m.total_stores||0} total · ${m.past_due_subscriptions||0} past due</div></div>
          <div class="a-card"><h3>Lead Pipeline</h3><div class="a-kpi">${pipeline.total_leads||0}</div><div class="a-sub">${pipeline.hot_leads||0} hot · ${(pipeline.conversion_rate||0).toFixed(1)}% converted</div></div>
        </div>
        <div class="admin-grid2">
          <div class="a-card"><h3>Risk Distribution</h3><div class="chart-wrap"><canvas id="ov-risk"></canvas></div></div>

                  </div>
                  <div style="font-size:11px;color:var(--muted);white-space:nowrap">just now</div>
                `;
                if (firstChild) {
                  activityDiv.insertBefore(newEl, firstChild);

                  activityDiv.appendChild(newEl);
                }
                // Keep only last 15 items
                while (activityDiv.children.length > 15) {
                  activityDiv.removeChild(activityDiv.lastChild);
                }
                // Flash effect
                setTimeout(() => { newEl.style.background = 'transparent'; }, 2000);
              }
            } catch (e) {}
          };

    function timeAgo(timestamp) {
      const seconds = Math.floor((Date.now() - new Date(timestamp).getTime()) / 1000);
      if (seconds < 60) return `${seconds}s ago`;
      const minutes = Math.floor(seconds / 60);
      if (minutes < 60) return `${minutes}m ago`;
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return `${hours}h ago`;
      const days = Math.floor(hours / 24);
      return `${days}d ago`;
    }

    window.quickCreateCamp = async function (type, name, channel) {
      try {

        if (data.campaign) toast("✅ Campaign created: " + data.campaign.name);
        else toast("⚠️ " + (data.error || "Failed"));
      } catch (e) { toast("⚠️ " + e.message); }
    };

    window.createCampaign = async function () {
      const name = $("#camp-name")?.value?.trim();
      const type = $("#camp-type")?.value;

      if (!name) { toast("⚠️ Enter a campaign name"); return; }
      try {
        const res = await fetch(API + "/admin/intel/campaigns", { method: "POST", headers: { "X-API-Key": API_KEY, "Content-Type": "application/json" }, body: JSON.stringify({ name, type, channel }) });
        const data = await res.json();
        if (data.campaign) toast("✅ Campaign created: " + data.campaign.name);
        else toast("⚠️ " + (data.error || "Failed"));
      } catch (e) { toast("⚠️ " + e.message); }
    };

              <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:0">Recent Invoices</h3>
            </div>
            <button class="a-btn a-btn-primary" onclick="toast('Exporting invoices...')">Export CSV</button>
          </div>
          <div style="overflow-x:auto;margin-top:12px">
            <table class="a-table">
              <thead><tr><th>Invoice</th><th>Store</th><th>Amount</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
              <tbody>
                ${invoices.length === 0 ? `
                  <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">No invoices yet. Invoices are generated when stores are billed.</td></tr>
                ` : invoices.map(inv => `
                  <tr>
                    <td><b>${esc(inv.id || inv.invoice_id || "INV-" + Math.random().toString(36).slice(2,8))}</b></td>
                    <td>${esc(inv.store)}</td>
                    <td>${money(inv.amount)}</td>
                    <td><span class="a-pill ${inv.status === 'paid' ? 'a-pill-green' : inv.status === 'pending' ? 'a-pill-amber' : 'a-pill-red'}">${inv.status}</span></td>
                    <td>${esc(inv.date || inv.created_at || "N/A")}</td>
                    <td><button class="a-btn a-btn-sm" onclick="toast('Viewing invoice ${esc(inv.id)}')">View</button></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>`;
    }

    /* ── Support Desk ──────────────────────────────────────────── */
    async function renderSupport(container = view) {
      const stores = await api("/admin/stores").catch(() => ({ stores: [] }));
      const storeList = stores.stores || [];

      container.innerHTML = `
        <div class="admin-grid4">
          <div class="a-card"><h3>Open Tickets</h3><div class="a-kpi">0</div><div class="a-sub">Needs response</div></div>
          <div class="a-card"><h3>Pending</h3><div class="a-kpi" style="color:var(--amber)">0</div><div class="a-sub">Awaiting reply</div></div>
          <div class="a-card"><h3>Critical</h3><div class="a-kpi" style="color:var(--red)">0</div><div class="a-sub">Urgent issues</div></div>
          <div class="a-card"><h3>Total Stores</h3><div class="a-kpi">${storeList.length}</div><div class="a-sub">On platform</div></div>
        </div>
        <div class="a-card a-section">
          <div class="a-row">
            <div>
              <div class="section-chip">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                Support Tickets
              </div>
              <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:0">Recent Tickets</h3>
            </div>
          </div>
          <div style="overflow-x:auto;margin-top:12px">
            <table class="a-table">
              <thead><tr><th>Ticket</th><th>Store</th><th>Subject</th><th>Priority</th><th>Status</th><th>Created</th></tr></thead>
              <tbody>
                <tr><td colspan="6" style="text-align:center;padding:24px;color:var(--muted)">No support tickets yet. Tickets appear here when store owners submit them.</td></tr>
              </tbody>
            </table>
          </div>
        </div>`;
    }

    /* ── System Settings ────────────────────────────────────────── */
    async function renderSettings(container = view) {
      const [plans, rateLimits, demoStatus] = await Promise.all([
        api("/payment/plans").catch(() => ({})),
        api("/rate-limit/plans").catch(() => ({})),
        api("/admin/demo/status").catch(() => ({})),
      ]);

      container.innerHTML = `
        <div class="admin-grid3">
          <div class="a-card">
            <div class="section-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
              General Settings
            </div>
            <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:8px 0">Platform Configuration</h3>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
              <label style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--surface-2);border-radius:8px">
                <span style="font-size:13px">Demo Simulator</span>
                <span class="a-pill ${demoStatus.running ? 'a-pill-green' : 'a-pill-gray'}">${demoStatus.running ? 'Running' : 'Stopped'}</span>
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--surface-2);border-radius:8px">
                <span style="font-size:13px">Events Generated</span>
                <span style="font-weight:600">${demoStatus.events_generated || 0}</span>
              </label>
              <label style="display:flex;justify-content:space-between;align-items:center;padding:8px;background:var(--surface-2);border-radius:8px">
                <span style="font-size:13px">Running Stores</span>
                <span style="font-weight:600">${(demoStatus.running_stores || []).length}</span>
              </label>
            </div>
          </div>
          <div class="a-card">
            <div class="section-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-3.6 8-10V5.5L12 2 4 5.5V12c0 6.4 8 10 8 10z"/></svg>
              Rate Limiting
            </div>
            <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:8px 0">API Rate Limits</h3>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
              ${Object.entries(rateLimits || {}).map(([plan, limits]) => `
                <div style="padding:8px;background:var(--surface-2);border-radius:8px">
                  <div style="font-weight:600;font-size:13px;text-transform:capitalize;margin-bottom:4px">${plan}</div>
                  <div style="font-size:12px;color:var(--muted)">${limits.requestsPerMinute || 60}/min · ${limits.requestsPerDay || 1000}/day</div>
                </div>
              `).join("")}
            </div>
          </div>
          <div class="a-card">
            <div class="section-chip">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>
              Subscription Plans
            </div>
            <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:8px 0">Active Plans</h3>
            <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
              ${Object.entries(plans.plans || {}).map(([key, p]) => {
                const name = key.replace("_inr", "").charAt(0).toUpperCase() + key.replace("_inr", "").slice(1);
                const isINR = key.endsWith("_inr");
                return `<div style="padding:8px;background:var(--surface-2);border-radius:8px;display:flex;justify-content:space-between;align-items:center">
                  <span style="font-weight:600;font-size:13px">${esc(name)}</span>
                  <span style="font-weight:600">${isINR?"₹":"$"}${p.monthly}/mo</span>
                </div>`;
              }).join("")}
            </div>
          </div>
        </div>
        <div class="a-card a-section">
          <div class="section-chip">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            System Health
          </div>
          <h3 style="font-size:14px;color:var(--text);font-weight:600;margin:8px 0 12px">Platform Status</h3>
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
            ${[
              { name: "API Server", status: "healthy" },
              { name: "In-Memory Store", status: "healthy" },
              { name: "Return Fraud Engine", status: "healthy" },
              { name: "Campaign Engine", status: demo.running ? "active" : "standby" },
            ].map(s => `
              <div style="padding:12px;background:var(--surface-2);border-radius:8px;text-align:center">
                <div style="font-weight:600;font-size:13px;margin-bottom:4px">${s.name}</div>
                <div class="a-pill ${s.status === 'healthy' || s.status === 'active' ? 'a-pill-green' : 'a-pill-amber'}" style="margin-bottom:4px">${s.status}</div>
              </div>
            `).join("")}
          </div>
        </div>`;
    }

    /* ── Return Fraud ─────────────────────────────────────── */
    async function renderReturnFraud(container = view) {
      const [fraudTrends, perfData] = await Promise.all([
        api("/admin/return-fraud/trends"),
        api("/admin/return-fraud/model-performance")
      ]);

      const totalReturns = fraudTrends.total_returns || 0;
      const flagged = (perfData.flagged_returns || 0);
      const autoApproved = (perfData.auto_approved || 0);
      const autoDenied = (perfData.auto_denied || 0);
      const avgScore = (perfData.avg_risk_score || 0).toFixed(1);
      const accuracy = (perfData.accuracy_estimate || 0);

      const storeData = fraudTrends.by_store || {};
      const stores = Object.entries(storeData);

      container.innerHTML = `
        <div class="b-header">
          <div><h2>Return Fraud Shield</h2><p>Intelligent return fraud detection and prevention across all stores</p></div>
        </div>
        <div class="admin-grid4" style="margin-bottom:24px">
          <div class="a-card"><div class="a-sub">Total Returns</div><div class="a-kpi">${totalReturns}</div><div class="a-sub">Across ${fraudTrends.store_count || 0} stores</div></div>
          <div class="a-card"><div class="a-sub">Flagged</div><div class="a-kpi">${flagged}</div><div class="a-sub">Risk score &gt; 50</div></div>
          <div class="a-card"><div class="a-sub">Auto-Approved</div><div class="a-kpi">${autoApproved}</div><div class="a-sub">Low risk returns</div></div>
          <div class="a-card"><div class="a-sub">Auto-Denied</div><div class="a-kpi">${autoDenied}</div><div class="a-sub">High risk returns</div></div>
        </div>
        <div class="admin-grid4" style="margin-bottom:24px">
          <div class="a-card"><div class="a-sub">Avg Risk Score</div><div class="a-kpi">${avgScore}</div></div>
          <div class="a-card"><div class="a-sub">Accuracy Estimate</div><div class="a-kpi">${(accuracy * 100).toFixed(1)}%</div></div>
          <div class="a-card"><div class="a-sub">Flagged Rate</div><div class="a-kpi">${totalReturns > 0 ? ((flagged / totalReturns) * 100).toFixed(1) : 0}%</div></div>
          <div class="a-card"><div class="a-sub">Store Count</div><div class="a-kpi">${fraudTrends.store_count || 0}</div></div>
        </div>
        ${stores.length > 0 ? `
        <div class="a-card">
          <h3>Fraud by Store</h3>
          <table class="a-table">
            <thead><tr><th>Store</th><th>Total Returns</th><th>Flagged</th><th>Value</th></tr></thead>
            <tbody>
              ${stores.map(([sid, s]) => `<tr>
                <td style="font-weight:600">${esc(sid)}</td>
                <td>${s.total}</td>
                <td><span class="a-pill ${s.flagged > 0 ? 'a-pill-amber' : 'a-pill-green'}">${s.flagged}</span></td>
                <td>${money(s.value)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>` : '<div class="a-card"><p class="a-sub" style="text-align:center;padding:40px">No return data yet</p></div>'}`;
    }

    window.adminReturnAction = async function(id, action) {
      try { await fetch(API + "/returns/" + id + "/" + action, { method: "POST", headers: { "X-API-Key": API_KEY } }); toast("Return " + action + "d"); route(); } catch(e) { toast("Error: " + e.message); }
    };

    /* ── AI Model ─────────────────────────────────────── */
    async function renderAiModel(container = view) {
      const perf = await api("/admin/return-fraud/model-performance");
      container.innerHTML = `
        <div class="b-header"><div><h2>AI Model Performance</h2><p>Fraud detection model metrics</p></div></div>
        <div class="admin-grid4" style="margin-bottom:24px">
          <div class="a-card"><div class="a-sub">Total Returns</div><div class="a-kpi">${perf.total_returns || 0}</div></div>
          <div class="a-card"><div class="a-sub">Flagged Returns</div><div class="a-kpi">${perf.flagged_returns || 0}</div></div>
          <div class="a-card"><div class="a-sub">Auto-Approved</div><div class="a-kpi">${perf.auto_approved || 0}</div></div>
          <div class="a-card"><div class="a-sub">Auto-Denied</div><div class="a-kpi">${perf.auto_denied || 0}</div></div>
        </div>
        <div class="admin-grid2">
          <div class="a-card"><div class="a-sub">Avg Risk Score</div><div class="a-kpi">${(perf.avg_risk_score || 0).toFixed(1)}</div></div>
          <div class="a-card"><div class="a-sub">Accuracy Estimate</div><div class="a-kpi">${((perf.accuracy_estimate || 0) * 100).toFixed(1)}%</div></div>
        </div>
        <div class="a-card" style="margin-top:14px"><p class="a-sub">Model retraining happens automatically based on incoming return data. Current model is trained on return patterns, customer history, and order metadata.</p></div>`;
    }

    /* ── Init ─────────────────────────────────────────────────── */
    if (API_KEY) { showApp(); }
    $("#admin-key").addEventListener("keydown", (e) => { if (e.key === "Enter") adminLogin(); });
  })();
  </script>
</body>
</html>
